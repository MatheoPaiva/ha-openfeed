name: Release

# Tags a release commit and publishes the GitHub release. HACS installs the
# tagged files through the GitHub API (hacs.json zip_release false), so no
# zip is attached. House style, same as purcell-lab/ha-amber-v2x:
#   tag      vX.Y.Z (annotated), message "vX.Y.Z: <summary>"
#   release  title "vX.Y.Z - <summary>", notes from docs/releases/vX.Y.Z.md
# Bump manifest.json in the release commit first. The workflow refuses to tag
# a commit whose manifest does not carry the version, and never moves a tag.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v, e.g. 0.1.1. Must match manifest.json."
        required: true
        type: string
      summary:
        description: "Lower-case summary phrase for the tag message and release title."
        required: true
        type: string
      target:
        description: "Commit sha or branch to tag."
        required: false
        default: main
        type: string

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target }}
          fetch-depth: 0
      - name: Check manifest version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          actual=$(python3 -c 'import json;print(json.load(open("custom_components/openfeed/manifest.json"))["version"])')
          if [ "$actual" != "$VERSION" ]; then
            echo "manifest.json says $actual, not $VERSION" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION already exists" >&2
            exit 1
          fi
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SUMMARY: ${{ inputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION: $SUMMARY"
          git push origin "v$VERSION"
          notes="docs/releases/v$VERSION.md"
          if [ -f "$notes" ]; then
            gh release create "v$VERSION" --title "v$VERSION - $SUMMARY" --notes-file "$notes" --verify-tag
          else
            gh release create "v$VERSION" --title "v$VERSION - $SUMMARY" --generate-notes --verify-tag
          fi
